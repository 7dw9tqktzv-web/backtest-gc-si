# ============================================================================
# CONFIGURATION BACKTEST - SPREAD GC/SI MEAN REVERSION
# ============================================================================
# Ce fichier contient tous les paramètres configurables de la stratégie.
# Modifie les valeurs ici sans toucher au code Python.
# ============================================================================

# ----------------------------------------------------------------------------
# FICHIERS DE DONNÉES
# ----------------------------------------------------------------------------
data:
  gc_file: "data/raw/GCJ26_FUT_CME_1mn.scid_BarData.txt"
  si_file: "data/raw/SIH26_FUT_CME-1mn.scid_BarData.txt"
  gc_file_5s: "data/raw/GCJ26_FUT_CME_5secondes.scid_BarData.txt"
  si_file_5s: "data/raw/SIH26_FUT_CME_5secondes.scid_BarData.txt"
  
# ----------------------------------------------------------------------------
# SPÉCIFICATIONS DES CONTRATS (CME/COMEX)
# ----------------------------------------------------------------------------
contracts:
  mode: "standard"          # "standard" (GC/SI) ou "micro" (MGC/SIL)

  standard:
    gc_point_value: 100     # $/point GC (100 oz x $1/oz)
    gc_tick_size: 0.10      # $0.10/oz
    gc_tick_value: 10       # $10/tick (100 oz x $0.10)
    si_point_value: 5000    # $/point SI (5000 oz x $1/oz)
    si_tick_size: 0.005     # $0.005/oz
    si_tick_value: 25       # $25/tick (5000 oz x $0.005)

  micro:
    gc_point_value: 10      # $/point MGC (10 oz x $1/oz)
    gc_tick_size: 0.10      # $0.10/oz (identique au standard)
    gc_tick_value: 1         # $1/tick (10 oz x $0.10)
    si_point_value: 1000    # $/point SIL (1000 oz x $1/oz)
    si_tick_size: 0.005     # $0.005/oz (identique au standard)
    si_tick_value: 5         # $5/tick (1000 oz x $0.005)

# ----------------------------------------------------------------------------
# PARAMÈTRES DES INDICATEURS
# ----------------------------------------------------------------------------
indicators:
  period: "1min"            # Periode de calcul des indicateurs (1min, 5min, 15min, 1h, 1d)
  beta_lookback: 1320       # [barres] ~5 jours de trading @ 264 barres/jour en 1-min. TOP 1 config (CHANGELOG 2026-02-05)
  zscore_period: 20         # [barres] ~20 minutes en 1-min. TOP 1 config: zp20. ATTENTION: >= 30 produit 0 configs rentables
  correlation_period: 30    # [barres] ~30 minutes en 1-min. TOP 1 config: cp30
  adf_hurst_period: 128     # [barres] ~2h en 1-min. TOP 1 config: adf128 (filtre strict stationnarite)
  adf_critical_value: -2.86      # Valeur critique ADF a 5% (table MacKinnon, ~100 observations)
  coint_corr_threshold: 0.6      # Seuil de correlation pour le score de cointegration (redondant: toujours > 0.80)

# ----------------------------------------------------------------------------
# CONDITIONS D'ENTRÉE
# ----------------------------------------------------------------------------
entry:
  zscore_long: -3.5         # [sans unite] Seuil d'entree LONG. 3.0-3.5 = seule plage viable (112/115 configs rentables a 3.5)
  zscore_short: 3.5         # [sans unite] Seuil d'entree SHORT (symetrique)
  correlation_min: 0.60     # [0-1] Correlation Pearson minimum (redondant: toujours > 0.80 quand Z+Coint OK)
  cointegration_score_min: 50  # [0-100] Score composite minimum. Equilibre frequence/qualite des trades
  hurst_max: 1.0              # [0-1] Hurst max (1.0 = desactive). Redondant: Hurst < 0.45 sur toutes les barres tradees

# ----------------------------------------------------------------------------
# CONDITIONS DE SORTIE
# ----------------------------------------------------------------------------
exit:
  # Sortie sur Z-Score
  zscore_tp_enabled: false   # TP_ZSCORE desactive = optimal (sort quand le mouvement $ est trop petit pour couvrir les couts)
  zscore_tp_long: -2.0      # [sans unite] TP LONG : sortie si Z >= cette valeur (Z revient vers 0)
  zscore_sl_long: -3.5      # [sans unite] SL LONG : sortie si Z <= cette valeur (Z continue a baisser)
  zscore_tp_short: 2.0      # [sans unite] TP SHORT : sortie si Z <= cette valeur (Z revient vers 0)
  zscore_sl_short: 3.5      # [sans unite] SL SHORT : sortie si Z >= cette valeur (Z continue a monter)

  # Sortie sur PnL (en dollars) - detectee sur barres 5s pour plus de precision
  pnl_take_profit: 500      # [USD brut] TP $500 (TOP 1 config, 82.8% WR). Parametre le plus impactant
  pnl_stop_loss: -1200      # [USD brut] SL -$1200 (TOP 1 config). Ratio risque/recompense = 2.4:1
  zscore_tp_min_pnl: null   # [USD net ou null] PnL min pour TP_ZSCORE (null = desactive, ex: 100 = $100 net min)

# ----------------------------------------------------------------------------
# CONDITION DE RÉENTRÉE
# ----------------------------------------------------------------------------
reentry:
  # Après un stop, on doit attendre que Z revienne vers 0 avant de reprendre
  zscore_reset_long: -1.0   # Pour LONG: Z doit remonter à -1 avant nouvelle entrée
  zscore_reset_short: 1.0   # Pour SHORT: Z doit descendre à +1 avant nouvelle entrée

# ----------------------------------------------------------------------------
# SIZING DES POSITIONS
# ----------------------------------------------------------------------------
sizing:
  mode: "dollar_neutral_beta"  # Options: "fixed", "dollar_neutral", "dollar_neutral_beta"
  si_contracts: 1              # Nombre de contrats SI de base
  gc_contracts_max: 0          # Cap sur les contrats GC (0 = pas de cap)
  # Note: Le nombre de contrats GC sera calculé automatiquement :
  # GC_contracts = (SI_notional / GC_notional) × Beta

# ----------------------------------------------------------------------------
# COÛTS DE TRANSACTION
# ----------------------------------------------------------------------------
costs:
  commission_per_contract: 4.00   # [USD] Aller-retour par contrat ($2.00 x 2 sides)
  slippage_gc_ticks: 1            # [ticks] GC: 1 tick = $10. CRITIQUE: 2 ticks detruit la strategie
  slippage_si_ticks: 1            # [ticks] SI: 1 tick = $25. CRITIQUE: 2 ticks detruit la strategie
  # Cout total typique (1 GC + 1 SI, 1 tick): $8 commission + $70 slippage = $78/trade

# ----------------------------------------------------------------------------
# SESSION DE TRADING
# ----------------------------------------------------------------------------
session:
  start_time: "18:00:00"    # Début de session (heure locale Chicago)
  end_time: "17:00:00"      # Fin de session
  entry_start_hour: 0       # Pas d'entree avant cette heure CT (0 = desactive)
  entry_end_hour: 24        # Pas d'entree apres cette heure CT (24 = desactive)
  # Note: Les données ont déjà les 30 premières/dernières minutes enlevées

# ----------------------------------------------------------------------------
# PARAMETRES AVANCES (nouvelles strategies - independantes de l'existant)
# ----------------------------------------------------------------------------
# ----------------------------------------------------------------------------
# REGIME FILTER (Phase C2b) - Filtres daily pour bloquer les entrees
# ----------------------------------------------------------------------------
# Logique OR : un seul filtre declenche suffit a bloquer.
# Ne bloque que les nouvelles entrees (positions ouvertes non affectees).
regime_filter:
  enabled: false          # Desactive par defaut (retrocompatibilite)
  halflife_ar1:
    enabled: true
    window: 60            # Fenetre en jours de trading
    threshold: 4.9        # Jours -- au-dessus = blocage des entrees
  correlation_daily:
    enabled: true
    window: 40            # Fenetre en jours de trading
    threshold: 0.86       # En-dessous = blocage. Sweet spot C2b (52 trades, PF 7.84)

# ----------------------------------------------------------------------------
# PARAMETRES AVANCES (nouvelles strategies - independantes de l'existant)
# ----------------------------------------------------------------------------
advanced:
  # Mode de calcul des indicateurs
  indicator_mode: "rolling"

  # Filtre de regime HMM (Hidden Markov Model) - legacy
  regime_filter: false
  regime_states: 3

  # Hyperparametre alpha pour Kalman (si indicator_mode = "kalman")
  kalman_alpha: 1.0e-6

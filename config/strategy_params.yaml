# ============================================================================
# CONFIGURATION BACKTEST - SPREAD GC/SI MEAN REVERSION
# ============================================================================
# Ce fichier contient tous les paramètres configurables de la stratégie.
# Modifie les valeurs ici sans toucher au code Python.
# ============================================================================

# ----------------------------------------------------------------------------
# FICHIERS DE DONNÉES
# ----------------------------------------------------------------------------
data:
  gc_file: "data/raw/GCJ26_FUT_CME_1mn.scid_BarData.txt"
  si_file: "data/raw/SIH26_FUT_CME-1mn.scid_BarData.txt"
  gc_file_5s: "data/raw/GCJ26_FUT_CME_5secondes.scid_BarData.txt"
  si_file_5s: "data/raw/SIH26_FUT_CME_5secondes.scid_BarData.txt"
  
# ----------------------------------------------------------------------------
# SPÉCIFICATIONS DES CONTRATS (CME/COMEX)
# ----------------------------------------------------------------------------
contracts:
  # Gold (GC) - COMEX 100 oz
  gc_point_value: 100       # $100 par point de prix
  gc_tick_size: 0.10        # Tick minimum = $0.10
  gc_tick_value: 10         # $10 par tick
  
  # Silver (SI) - COMEX 5000 oz
  si_point_value: 5000      # $5000 par point de prix
  si_tick_size: 0.005       # Tick minimum = $0.005
  si_tick_value: 25         # $25 par tick

# ----------------------------------------------------------------------------
# PARAMÈTRES DES INDICATEURS
# ----------------------------------------------------------------------------
indicators:
  period: "1min"            # Période de calcul des indicateurs (1min, 5min, 15min, 1h, 1d)
  beta_lookback: 1320       # Best config: b1320_zp24_cp24_adf96 (CHANGELOG 2026-02-04)
  zscore_period: 24         # Best config: zp24
  correlation_period: 24    # Best config: cp24
  adf_hurst_period: 96      # Best config: adf96
  adf_critical_value: -2.86      # Valeur critique ADF a 5% pour le score de cointegration
  coint_corr_threshold: 0.6      # Seuil de correlation dans le score de cointegration

# ----------------------------------------------------------------------------
# CONDITIONS D'ENTRÉE
# ----------------------------------------------------------------------------
entry:
  zscore_long: -3.0         # Best config: zE3.0 (CHANGELOG 2026-02-04)
  zscore_short: 3.0         # Best config: zE3.0
  correlation_min: 0.60     # Corrélation minimum requise
  cointegration_score_min: 50  # Meilleure config 1mn (PnL2 walk-forward)
  hurst_max: 1.0              # Hurst maximum (1.0 = desactive, 0.50 = filtre strict mean reversion)

# ----------------------------------------------------------------------------
# CONDITIONS DE SORTIE
# ----------------------------------------------------------------------------
exit:
  # Sortie sur Z-Score
  zscore_tp_enabled: false   # Meilleure config 1mn desactive TP_ZSCORE (tpzOFF domine)
  zscore_tp_long: -2.0      # Take Profit LONG : sortie si Z >= cette valeur
  zscore_sl_long: -3.5      # Stop Loss LONG : sortie si Z <= cette valeur
  zscore_tp_short: 2.0      # Take Profit SHORT : sortie si Z <= cette valeur
  zscore_sl_short: 3.5      # Stop Loss SHORT : sortie si Z >= cette valeur
  
  # Sortie sur PnL (en dollars)
  pnl_take_profit: 1000     # Meilleure config 1mn (PnL2 walk-forward)
  pnl_stop_loss: -1200      # Meilleure config 1mn (PnL2 walk-forward)
  zscore_tp_min_pnl: null   # PnL minimum pour TP_ZSCORE (null = pas de filtre, ex: 100 = $100 min)

# ----------------------------------------------------------------------------
# CONDITION DE RÉENTRÉE
# ----------------------------------------------------------------------------
reentry:
  # Après un stop, on doit attendre que Z revienne vers 0 avant de reprendre
  zscore_reset_long: -1.0   # Pour LONG: Z doit remonter à -1 avant nouvelle entrée
  zscore_reset_short: 1.0   # Pour SHORT: Z doit descendre à +1 avant nouvelle entrée

# ----------------------------------------------------------------------------
# SIZING DES POSITIONS
# ----------------------------------------------------------------------------
sizing:
  mode: "dollar_neutral_beta"  # Options: "fixed", "dollar_neutral", "dollar_neutral_beta"
  si_contracts: 1              # Nombre de contrats SI de base
  gc_contracts_max: 0          # Cap sur les contrats GC (0 = pas de cap)
  # Note: Le nombre de contrats GC sera calculé automatiquement :
  # GC_contracts = (SI_notional / GC_notional) × Beta

# ----------------------------------------------------------------------------
# COÛTS DE TRANSACTION
# ----------------------------------------------------------------------------
costs:
  commission_per_contract: 4.00   # $ par contrat aller-retour ($2.00 × 2)
  slippage_gc_ticks: 1            # 1 tick = seul scenario rentable sur 3 ans
  slippage_si_ticks: 1            # 1 tick = seul scenario rentable sur 3 ans

# ----------------------------------------------------------------------------
# SESSION DE TRADING
# ----------------------------------------------------------------------------
session:
  start_time: "18:00:00"    # Début de session (heure locale Chicago)
  end_time: "17:00:00"      # Fin de session
  entry_start_hour: 0       # Pas d'entree avant cette heure CT (0 = desactive)
  entry_end_hour: 24        # Pas d'entree apres cette heure CT (24 = desactive)
  # Note: Les données ont déjà les 30 premières/dernières minutes enlevées

# ----------------------------------------------------------------------------
# PARAMETRES AVANCES (nouvelles strategies - independantes de l'existant)
# ----------------------------------------------------------------------------
advanced:
  # Mode de calcul des indicateurs
  # "rolling" = methode actuelle (Rolling OLS pour Beta, rolling window pour Z-Score)
  # "kalman" = methode Kalman Filter (Beta adaptatif, Z-Score auto-adaptatif)
  indicator_mode: "rolling"

  # Filtre de regime HMM (Hidden Markov Model)
  # true = active le filtre (bloque les trades en regime defavorable)
  # false = desactive (comportement actuel)
  regime_filter: false

  # Nombre d'etats HMM (si regime_filter = true)
  # 2 = Mean-Reverting vs Trending
  # 3 = Mean-Reverting vs Trending vs High-Volatility
  regime_states: 3

  # Hyperparametre alpha pour Kalman (si indicator_mode = "kalman")
  # Controle la vitesse d'adaptation du filtre et l'echelle du Z-Score
  # Valeurs typiques:
  #   1e-5 : Z-Score compresse (range ~[-1, 1])
  #   1e-6 : Z-Score comparable au Rolling (range ~[-2, 4]) <- RECOMMANDE
  #   1e-7 : Z-Score large (range ~[-6, 10])
  kalman_alpha: 1.0e-6

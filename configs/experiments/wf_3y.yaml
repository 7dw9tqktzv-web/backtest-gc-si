# Walk-Forward 3 ans - Top configs du grid search etendu (1 tick slippage)
# 10 configs (5 top PnL + 5 top Sharpe, Sharpe >= 1.0), 34 fenetres
#
# Usage: python scripts/run_walk_forward.py --config configs/experiments/wf_3y.yaml

type: walk_forward
title: "WALK-FORWARD 3 ANS - TOP CONFIGS (1 TICK SLIPPAGE)"

execution:
  timeframe: 1min
  output_path: output/walk_forward_3y_results.csv

walk_forward:
  train_days: 63
  test_days: 21
  step_days: 21
  warmup_bars: 4000
  selection_criterion: pnl_net

# Defaults : appliques sauf si le config les override
# (ex: Sh1-3 overrident exit.zscore_tp_enabled avec true)
defaults:
  costs.slippage_gc_ticks: 1
  costs.slippage_si_ticks: 1
  exit.zscore_tp_enabled: false

configs:
  # --- Top 5 par PnL (Sharpe >= 1.0) ---
  - label: "PnL1_b1320_zp20_cp30_zE3.5_co50_TP500_SL1200"
    overrides:
      indicators.beta_lookback: 1320
      indicators.zscore_period: 20
      indicators.correlation_period: 30
      indicators.adf_hurst_period: 128
      entry.zscore_long: -3.5
      entry.zscore_short: 3.5
      entry.cointegration_score_min: 50
      exit.pnl_take_profit: 500
      exit.pnl_stop_loss: -1200

  - label: "PnL2_b1320_zp20_cp30_zE3.5_co50_TP1000_SL1200"

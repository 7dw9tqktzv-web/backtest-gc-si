# Walk-Forward Test sur 8 mois de donnees GC/SI
# 12 configs (6 top PnL + 6 top Sharpe), 6 fenetres glissantes
#
# Usage: python scripts/run_walk_forward.py --config configs/experiments/wf_base.yaml

type: walk_forward
title: "WALK-FORWARD TEST (1-min, 8 mois)"

execution:
  timeframe: 1min
  output_path: output/walk_forward_results.csv

walk_forward:
  train_days: 30
  test_days: 15
  step_days: 25
  warmup_bars: 4000
  selection_criterion: pnl_net

configs:
  # --- Top 6 par PnL ---
  - label: "PnL1_b1320_zp20_cp30_co40_TP400_SL600"
    overrides:
      indicators.beta_lookback: 1320
      indicators.zscore_period: 20
      indicators.correlation_period: 30
      entry.cointegration_score_min: 40
      entry.zscore_long: -2.5
      entry.zscore_short: 2.5
      exit.pnl_take_profit: 400
      exit.pnl_stop_loss: -600


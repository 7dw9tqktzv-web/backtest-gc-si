# TEST RAPIDE - 12 configs seulement pour verifier le setup
#
# Usage: python scripts/run_grid_search.py --config configs/experiments/grid_5min_test.yaml

type: grid_search
title: "TEST RAPIDE 5-MIN"
exit_mode: dollar

execution:
  timeframe: 5min
  num_workers: 4
  output_path: output/grid_search_5min_test.csv
  min_trades_for_sharpe: 10

indicators:
  beta_lookback: [1320, 2640]
  zscore_period: [24]
  correlation_period: [24]
  adf_hurst_period: [96]

entry_exit:
  zscore_entry: [3.0]
  cointegration_min: [50]
  pnl_take_profit: [400, 600]
  pnl_stop_loss: [-500, -700, -900]

fixed_overrides:
  exit.zscore_tp_enabled: false
  costs.slippage_gc_ticks: 2
  costs.slippage_si_ticks: 2

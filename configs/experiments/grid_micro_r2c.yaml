# Grid Search Micro R2c - Affinage C2 sweet spot (b3960_zp36_cp30_adf128)
# 200,000 configs = 625 groupes indicateurs x 320 exits
#
# Base sur Deep Analysis R2b :
#   - C2 (b3960, zE3.25, co50) = seul profil stable 4/4 ans
#   - Beta long stabilise le spread (moins de faux signaux en 2023-2024)
#   - 148 trades uniques C2 vs C7 sont rentables ($4,401, 69.6% WR)
#   - Affinage fin autour des parametres C2 pour confirmer la stabilite
#
# Usage: python scripts/run_grid_search.py --config configs/experiments/grid_micro_r2c.yaml

type: grid_search
title: "GRID MICRO R2c - AFFINAGE C2 SWEET SPOT"
exit_mode: micro_full

execution:
  timeframe: 5min
  num_workers: 24
  output_path: output/grid_micro_r2c.csv
  min_trades_for_sharpe: 10

indicators:
  beta_lookback: [3300, 3630, 3960, 4290, 4620]
  zscore_period: [30, 33, 36, 39, 42]
  correlation_period: [24, 27, 30, 33, 36]
  adf_hurst_period: [96, 112, 128, 144, 160]

entry_exit:
  zscore_entry: [3.0, 3.125, 3.25, 3.375, 3.5]
  cointegration_min: [40, 45, 50, 55]
  zscore_tp: [0.0, 0.5, 1.0, 1.5]
  zscore_sl: [99]
  dollar_tp: [250, 300, 350, 400]
  dollar_sl: [0]
  flat_end_of_session: [true]
  max_holding_bars: [0]
  micro_multiplier_max: [2]

fixed_overrides:
  contracts.mode: "micro"
  exit.zscore_tp_enabled: true
  costs.slippage_gc_ticks: 1
  costs.slippage_si_ticks: 1

# Grid Search Micro R2b - Outsider C9 (beta 2640-3960)
#
# Zoom autour de C9 (famille alternative) identifiee en R1 :
#   - b2640_zp30_cp12_adf26, mean reversion rapide (PnL decay inflexion barre 5)
#   - zTP negatif (-0.5) contribue au PnL contrairement a Famille A
#   - dSL=-1000 en R1, on fixe -500 pour coherence
#   - entry_start_hour comme variable build (×7 builds par groupe)
#
# Estimation : ~420 groupes ind × 63 builds × 378 replays = ~10M configs
# Mode micro (MGC/SIL), $1.88 commission, 2 ticks slippage
#
# Usage: python scripts/run_grid_search.py --config configs/experiments/grid_micro_r2b.yaml

type: grid_search
title: "GRID MICRO R2b - OUTSIDER C9 (beta 2640-3960)"
exit_mode: micro_full

execution:
  timeframe: 5min
  num_workers: 24
  output_path: output/grid_searches/r2b/grid_micro_r2b.csv
  min_trades_for_sharpe: 10

indicators:
  beta_lookback: [2640, 3300, 3960]
  zscore_period: [20, 24, 26, 28, 30, 33, 36]
  correlation_period: [12, 16, 20, 24]
  adf_hurst_period: [26, 32, 48, 64, 96]

entry_exit:
  zscore_entry: [3.0, 3.1, 3.2, 3.25, 3.3, 3.4, 3.5, 3.6, 3.75]
  cointegration_min: [20]
  zscore_tp: [-1.5, -1.25, -1.0, -0.75, -0.5, -0.25, 0.0, 0.25, 0.5]
  zscore_sl: [99]
  dollar_tp: [175, 200, 225, 250, 275, 300]
  dollar_sl: [-500]
  flat_end_of_session: [true]
  max_holding_bars: [0, 3, 6, 9, 12, 15, 18]
  micro_multiplier_max: [2]
  entry_start_hour: [18, 19, 20, 21, 22, 23, 0]

fixed_overrides:
  contracts.mode: "micro"
  exit.zscore_tp_enabled: true
  costs.slippage_gc_ticks: 2
  costs.slippage_si_ticks: 2
  session.session_end_time: "14:55"
  session.entry_end_hour: 14

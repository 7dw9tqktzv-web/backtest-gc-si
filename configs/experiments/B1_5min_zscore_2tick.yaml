# Phase B1 -- 5min Z-Score pur, 2 ticks slippage
# Objectif : explorer zones inexplorees avec zTP negatif, co=60, adf=96
# 320 groupes indicateurs x 108 entry/exit = 34,560 configs
# Temps estime : 2-3h (skip 5s actif car pure zscore)
#
# Usage: python scripts/run_grid_search.py --config configs/experiments/B1_5min_zscore_2tick.yaml

type: grid_search
title: "PHASE B1 - 5MIN ZSCORE PUR 2 TICKS"
exit_mode: zscore

execution:
  timeframe: 5min
  num_workers: 24
  output_path: output/grid_search_B1_5min_zscore_2tick.csv
  min_trades_for_sharpe: 10

indicators:
  beta_lookback: [1320, 2640, 3960, 5280]
  zscore_period: [20, 24, 30, 48, 60]
  correlation_period: [12, 24, 36, 60]
  adf_hurst_period: [26, 64, 96, 128]

entry_exit:
  zscore_entry: [2.5, 3.0, 3.5]
  cointegration_min: [40, 50, 60]
  zscore_tp: [-1.0, -0.5, 0.0, 0.5]
  zscore_sl: [3.5, 4.5, 5.0]
  dollar_modes: [pure_zscore]

fixed_overrides:
  exit.zscore_tp_enabled: true
  exit.pnl_take_profit: 99999
  exit.pnl_stop_loss: -99999
  costs.slippage_gc_ticks: 2
  costs.slippage_si_ticks: 2

# Grid Search Micro Round 1 - Exploration complete prop firm
# 252,000 configs (20 zE/zSL valides * 5 * 6 * 6 * 7 * 1 * 5 * 2) - Estimee ~12.5h
# Filtre dynamique : skip si zSL <= zE
#
# Indicateurs fixes a la config prod (b2640, zp20, cp30, adf26)
# Mode micro (MGC/SIL), $1.88 commission, 1 tick slippage
#
# Usage: python scripts/run_grid_search.py --config configs/experiments/grid_micro_r1.yaml

type: grid_search
title: "GRID MICRO R1 - EXPLORATION PROP FIRM (252K configs)"
exit_mode: micro_full

execution:
  timeframe: 5min
  num_workers: 24
  output_path: output/grid_micro_r1.csv
  min_trades_for_sharpe: 10

indicators:
  beta_lookback: [2640]
  zscore_period: [20]
  correlation_period: [30]
  adf_hurst_period: [26]

entry_exit:
  zscore_entry: [2.5, 3.0, 3.25, 3.5, 3.75, 4.0]
  cointegration_min: [20, 30, 40, 50, 60]
  zscore_tp: [0.0, 0.5, 0.75, 1.0, 1.5, 2.0]
  zscore_sl: [3.5, 4.0, 5.0, 99]
  dollar_tp: [0, 300, 400, 500, 600, 700]
  dollar_sl: [0, -400, -500, -600, -800, -1000, -1200]
  flat_end_of_session: [true]
  max_holding_bars: [0, 30, 60, 100, 200]
  micro_multiplier_max: [1, 2]

fixed_overrides:
  contracts.mode: "micro"
  exit.zscore_tp_enabled: true
  costs.slippage_gc_ticks: 1
  costs.slippage_si_ticks: 1

# Phase B6 -- 1min Dollar zp long, 1 tick slippage
# Objectif : exploration maximale zp longs (48-264) - zone 100% inexploree
# Comparaison avec B4 (zp courts 15-24) : stabilisation du signal ?
# 288 groupes indicateurs x 12 entry x 25 exit = 86,400 configs
# Temps estime : ~15h (1min dollar = pas de skip 5s, ~95 configs/min)
#
# Usage: python scripts/run_grid_search.py --config configs/experiments/B6_1min_dollar_zp_long_1tick.yaml

type: grid_search
title: "PHASE B6 - 1MIN DOLLAR ZP LONG 1 TICK"
exit_mode: dollar

execution:
  timeframe: 1min
  num_workers: 24
  output_path: output/grid_search_B6_1min_dollar_zp_long_1tick.csv
  min_trades_for_sharpe: 20

indicators:
  beta_lookback: [1320, 1980, 2640, 3960]
  zscore_period: [48, 72, 96, 132, 198, 264]
  correlation_period: [24, 48, 96]
  adf_hurst_period: [26, 64, 96, 128]

entry_exit:
  zscore_entry: [2.0, 2.5, 3.0, 3.5]
  cointegration_min: [40, 50, 60]
  pnl_take_profit: [300, 500, 800, 1000, 1500]
  pnl_stop_loss: [-500, -800, -1000, -1200, -1500]

fixed_overrides:
  exit.zscore_tp_enabled: false
  costs.slippage_gc_ticks: 1
  costs.slippage_si_ticks: 1

# Phase B2 -- 5min Z-Score pur, 1 tick slippage
# Objectif : mesurer l'attrition slippage vs B1 (2 ticks)
# Grille IDENTIQUE a B1 pour comparaison directe
# 320 groupes indicateurs x 108 entry/exit = 34,560 configs
# Temps estime : ~18 min (skip 5s actif car pure zscore)
#
# Usage: python scripts/run_grid_search.py --config configs/experiments/B2_5min_zscore_1tick.yaml

type: grid_search
title: "PHASE B2 - 5MIN ZSCORE PUR 1 TICK"
exit_mode: zscore

execution:
  timeframe: 5min
  num_workers: 24
  output_path: output/grid_search_B2_5min_zscore_1tick.csv
  min_trades_for_sharpe: 10

indicators:
  beta_lookback: [1320, 2640, 3960, 5280]
  zscore_period: [20, 24, 30, 48, 60]
  correlation_period: [12, 24, 36, 60]
  adf_hurst_period: [26, 64, 96, 128]

entry_exit:
  zscore_entry: [2.5, 3.0, 3.5]
  cointegration_min: [40, 50, 60]
  zscore_tp: [-1.0, -0.5, 0.0, 0.5]
  zscore_sl: [3.5, 4.5, 5.0]
  dollar_modes: [pure_zscore]

fixed_overrides:
  exit.zscore_tp_enabled: true
  exit.pnl_take_profit: 99999
  exit.pnl_stop_loss: -99999
  costs.slippage_gc_ticks: 1
  costs.slippage_si_ticks: 1

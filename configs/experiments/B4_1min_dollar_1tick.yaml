# Phase B4 -- 1min Dollar exits, 1 tick slippage
# Objectif : affinage zone connue (b1320, zp20) + beta=1980
# 81 groupes indicateurs x 120 entry/exit = 9,720 configs
# Temps estime : 1-2h
#
# Usage: python scripts/run_grid_search.py --config configs/experiments/B4_1min_dollar_1tick.yaml

type: grid_search
title: "PHASE B4 - 1MIN DOLLAR 1 TICK"
exit_mode: dollar

execution:
  timeframe: 1min
  num_workers: 24
  output_path: output/grid_search_B4_1min_dollar_1tick.csv
  min_trades_for_sharpe: 20

indicators:
  beta_lookback: [1320, 1980, 2640]
  zscore_period: [15, 20, 24]
  correlation_period: [24, 30, 48]
  adf_hurst_period: [64, 96, 128]

entry_exit:
  zscore_entry: [2.5, 3.0, 3.5]
  cointegration_min: [40, 50]
  pnl_take_profit: [300, 400, 500, 700, 1000]
  pnl_stop_loss: [-500, -800, -1000, -1200]

fixed_overrides:
  exit.zscore_tp_enabled: false
  costs.slippage_gc_ticks: 1
  costs.slippage_si_ticks: 1

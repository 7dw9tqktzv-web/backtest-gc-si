# Grid Search 5-min Hybride (Dollars Only) - Donnees 3 ans
# 24 groupes indicateurs x 108 entry/exit = 4,032 configs (tout en dollar)
#
# Usage: python scripts/run_grid_search.py --config configs/experiments/grid_5min_hybrid.yaml

type: grid_search
title: "GRID SEARCH 5-MIN HYBRIDE (DOLLARS ONLY) - 24 WORKERS"
exit_mode: dollar

execution:
  timeframe: 5min
  num_workers: 24
  output_path: output/grid_search_5min_hybrid.csv
  min_trades_for_sharpe: 50

indicators:
  beta_lookback: [1320, 2640, 3960, 5280, 6600, 7920]
  zscore_period: [18, 20, 24, 30]
  correlation_period: [24]
  adf_hurst_period: [96]

entry_exit:
  zscore_entry: [2.5, 3.0, 3.5]
  cointegration_min: [50]
  pnl_take_profit: [300, 450, 600, 750, 900, 1000]
  pnl_stop_loss: [-400, -550, -700, -850, -1000, -1200]

fixed_overrides:
  exit.zscore_tp_enabled: false
  costs.slippage_gc_ticks: 2
  costs.slippage_si_ticks: 2
